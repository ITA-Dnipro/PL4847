name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    defaults:
      run:
        shell: bash


    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_db
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DEBUG: "True"
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ci_db
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DJANGO_SETTINGS_MODULE: project.settings.dev

    steps:
      - name: Install git (missing in python:3.12-slim)
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        id: flake8
        working-directory: backend
        continue-on-error: true
        run: |
          set +o pipefail
          {
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            rc1=$?
            flake8 . --count --statistics
            rc2=$?
            exit $(( rc1 != 0 || rc2 != 0 ))
          } 2>&1 | tee /tmp/flake8.log
          exit ${PIPESTATUS[0]}

      - name: Check import order with isort
        id: isort
        working-directory: backend
        continue-on-error: true
        run: |
          isort . --check-only --diff 2>&1 | tee /tmp/isort.log
          exit ${PIPESTATUS[0]}

      - name: Check formatting with black
        id: black
        working-directory: backend
        continue-on-error: true
        run: |
          black . --check --diff --quiet 2>&1 | tee /tmp/black.log
          exit ${PIPESTATUS[0]}

      - name: Run Django system checks
        id: django_check
        working-directory: backend
        continue-on-error: true
        run: |
          python manage.py check 2>&1 | tee /tmp/django_check.log
          exit ${PIPESTATUS[0]}

      - name: Apply migrations (sanity check against the CI database)
        id: migrate
        working-directory: backend
        continue-on-error: true
        run: |
          python manage.py migrate --noinput 2>&1 | tee /tmp/migrate.log
          exit ${PIPESTATUS[0]}

      - name: Run tests
        id: tests
        working-directory: backend
        continue-on-error: true
        run: |
          if ! find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            echo "Error: No test files found! PR cannot be merged without tests." | tee /tmp/tests.log
            exit 1
          fi
          pytest 2>&1 | tee /tmp/tests.log
          exit ${PIPESTATUS[0]}

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Report all backend check results
        if: always()
        run: |
          declare -A results=(
            [flake8]="${{ steps.flake8.outcome }}"
            [isort]="${{ steps.isort.outcome }}"
            [black]="${{ steps.black.outcome }}"
            [django_check]="${{ steps.django_check.outcome }}"
            [migrate]="${{ steps.migrate.outcome }}"
            [tests]="${{ steps.tests.outcome }}"
          )
          declare -A logs=(
            [flake8]=/tmp/flake8.log
            [isort]=/tmp/isort.log
            [black]=/tmp/black.log
            [django_check]=/tmp/django_check.log
            [migrate]=/tmp/migrate.log
            [tests]=/tmp/tests.log
          )
          failed=0
          echo "== Backend check summary =="
          for name in flake8 isort black django_check migrate tests; do
            outcome="${results[$name]}"
            if [ "$outcome" = "success" ]; then
              echo "Completed $name"
            else
              failed=1
              echo ""
              echo "Not completed $name ($outcome) — reason:"
              echo "────────────────────────────────────────"
              if [ -s "${logs[$name]}" ]; then
                cat "${logs[$name]}"
              else
                echo "(no output captured for this step)"
              fi
              echo "────────────────────────────────────────"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "One or more checks failed — see the reason(s) printed above."
            exit 1
          fi
          echo ""
          echo "All backend checks passed."

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: eslint
        continue-on-error: true
        run: |
          npm run lint 2>&1 | tee /tmp/eslint.log
          exit ${PIPESTATUS[0]}

      - name: Build
        id: build
        continue-on-error: true
        run: |
          npm run build 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Report all frontend check results
        if: always()
        run: |
          declare -A results=(
            [eslint]="${{ steps.eslint.outcome }}"
            [build]="${{ steps.build.outcome }}"
          )
          declare -A logs=(
            [eslint]=/tmp/eslint.log
            [build]=/tmp/build.log
          )
          failed=0
          echo "== Frontend check summary =="
          for name in eslint build; do
            outcome="${results[$name]}"
            if [ "$outcome" = "success" ]; then
              echo "Completed $name"
            else
              failed=1
              echo ""
              echo "Not completed $name ($outcome) — reason:"
              echo "────────────────────────────────────────"
              if [ -s "${logs[$name]}" ]; then
                cat "${logs[$name]}"
              else
                echo "(no output captured for this step)"
              fi
              echo "────────────────────────────────────────"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "One or more checks failed — see the reason(s) printed above."
            exit 1
          fi
          echo ""
          echo "All frontend checks passed."

  ci-status:
    name: CI Status
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
